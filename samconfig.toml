version = 0.1

# Une seule région pour toutes les ressources.
# eu-west-1 (Irlande) et non eu-west-3 (Paris) : Amazon Comprehend n'est pas
# disponible à Paris. Les régions européennes servant Comprehend sont
# eu-west-1, eu-west-2 (Londres) et eu-central-1 (Francfort).

[default.global.parameters]
stack_name = "nordichome"

[default.validate.parameters]
lint = true

[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
region = "eu-west-1"
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
confirm_changeset = true
fail_on_empty_changeset = false
tags = "projet=\"nordichome-satisfaction\" contexte=\"academique\""

[default.delete.parameters]
region = "eu-west-1"
no_prompts = false
