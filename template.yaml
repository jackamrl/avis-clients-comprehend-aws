AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: >
  NordicHome — Reporting hebdomadaire de satisfaction client.
  Chaîne serverless : S3 -> Lambda -> Amazon Comprehend -> DynamoDB,
  agrégation hebdomadaire planifiée par EventBridge Scheduler, restitution par
  e-mail (SES) et via un tableau de bord statique protégé par Cognito.

# --------------------------------------------------------------------------- #
Parameters:
# --------------------------------------------------------------------------- #
  EmailExpediteur:
    Type: String
    Description: >
      Adresse d'envoi des rapports. Une identité SES est créée : un e-mail de
      vérification est envoyé à cette adresse au déploiement.
    AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"

  EmailManager:
    Type: String
    Description: >
      Destinataire du rapport hebdomadaire et des alertes CloudWatch.
      SES restant en bac à sable, cette adresse doit elle aussi être vérifiée.
    AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"

  ExpressionPlanification:
    Type: String
    Default: "cron(0 8 ? * MON *)"
    Description: Planification EventBridge Scheduler (par défaut lundi 08h00).

  FuseauPlanification:
    Type: String
    Default: Europe/Paris
    Description: Fuseau appliqué à la planification et au calcul de la fenêtre.

  RetentionLogsJours:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90]
    Description: Rétention CloudWatch Logs. Volontairement courte pour rester en free tier.

# --------------------------------------------------------------------------- #
Conditions:
# --------------------------------------------------------------------------- #
  # SES en bac à sable exige que l'expéditeur ET le destinataire soient vérifiés.
  # Si les deux adresses sont identiques, une seule identité doit être créée.
  DestinataireDistinct: !Not [!Equals [!Ref EmailExpediteur, !Ref EmailManager]]

# --------------------------------------------------------------------------- #
Globals:
# --------------------------------------------------------------------------- #
  Function:
    Runtime: python3.12
    # Graviton : environ 20 % moins cher que x86 à performance équivalente,
    # et aucune dépendance native ici qui imposerait l'architecture.
    Architectures: [arm64]
    MemorySize: 512
    Timeout: 30
    Tracing: Active
    Layers:
      - !Ref CoucheCommune
    Environment:
      Variables:
        NIVEAU_LOG: INFO

Resources:

  # ======================================================================== #
  # Stockage
  # ======================================================================== #

  # Le nom est construit avec !Sub plutôt que laissé à CloudFormation : la
  # politique IAM de la Lambda doit désigner ce bucket alors que le bucket
  # référence la Lambda via sa notification. Passer par un nom calculé rompt
  # la dépendance circulaire Bucket -> Fonction -> Rôle -> Bucket.
  BucketAvis:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-avis-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: purge-avis-bruts
            Status: Enabled
            Prefix: incoming/
            # Le texte de l'avis est déjà persisté dans DynamoDB après analyse :
            # conserver le fichier brut au-delà de 90 jours n'apporte rien.
            ExpirationInDays: 90

  BucketSiteWeb:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-dashboard-${AWS::AccountId}"
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  # Le dashboard est public ; ce sont l'API et les données qui sont protégées
  # par Cognito. En production on placerait CloudFront + OAC devant le bucket
  # pour servir en HTTPS et garder le bucket privé.
  PolitiqueSiteWeb:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BucketSiteWeb
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: LecturePubliqueDuDashboard
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${BucketSiteWeb.Arn}/*"

  TableAvis:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-Avis"
      # À la demande : aucune capacité à provisionner, facturation à l'usage.
      # Le trafic d'un flux d'avis est trop irrégulier pour un mode provisionné.
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: avis_id, AttributeType: S}
        - {AttributeName: mois, AttributeType: S}
        - {AttributeName: date, AttributeType: S}
      KeySchema:
        - {AttributeName: avis_id, KeyType: HASH}
      GlobalSecondaryIndexes:
        # Sans cet index, l'agrégation hebdomadaire devrait scanner toute la
        # table. Le partitionnement par mois borne la taille des partitions
        # tout en permettant un Query sur une plage de dates.
        - IndexName: avis-par-mois
          KeySchema:
            - {AttributeName: mois, KeyType: HASH}
            - {AttributeName: date, KeyType: RANGE}
          Projection: {ProjectionType: ALL}

  TableRapports:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-Rapports"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: semaine_id, AttributeType: S}
        - {AttributeName: type, AttributeType: S}
        - {AttributeName: date_generation, AttributeType: S}
      KeySchema:
        - {AttributeName: semaine_id, KeyType: HASH}
      GlobalSecondaryIndexes:
        # Clé primaire = accès direct à une semaine précise.
        # Index = listing chronologique pour le tableau de bord, sans Scan.
        - IndexName: rapports-par-date
          KeySchema:
            - {AttributeName: type, KeyType: HASH}
            - {AttributeName: date_generation, KeyType: RANGE}
          Projection: {ProjectionType: ALL}

  # ======================================================================== #
  # Couche partagée
  # ======================================================================== #

  CoucheCommune:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "${AWS::StackName}-commun"
      Description: Normalisation du français et lexique des thèmes métier.
      ContentUri: src/couche_commune/
      CompatibleRuntimes: [python3.12]
      CompatibleArchitectures: [arm64]
      RetentionPolicy: Delete

  # ======================================================================== #
  # Lambda #1 — ingestion et analyse unitaire
  # ======================================================================== #

  FileLettresMortes:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-traiter-avis-dlq"
      MessageRetentionPeriod: 1209600

  FonctionTraiterAvis:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-traiter-avis"
      Description: S3 -> Amazon Comprehend -> DynamoDB Avis
      CodeUri: src/traiter_avis/
      Handler: app.lambda_handler
      Environment:
        Variables:
          TABLE_AVIS: !Ref TableAvis
          LANGUE: fr
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt FileLettresMortes.Arn
      Policies:
        - S3ReadPolicy:
            BucketName: !Sub "${AWS::StackName}-avis-${AWS::AccountId}"
        - DynamoDBWritePolicy:
            TableName: !Ref TableAvis
        - Statement:
            - Effect: Allow
              # Les API de détection Comprehend ne portent pas sur une ressource
              # nommée : le caractère générique est ici la seule forme possible.
              Action:
                - comprehend:DetectSentiment
                - comprehend:DetectKeyPhrases
              Resource: "*"
      Events:
        DepotAvis:
          Type: S3
          Properties:
            Bucket: !Ref BucketAvis
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - {Name: prefix, Value: "incoming/"}
                  - {Name: suffix, Value: ".txt"}

  # ======================================================================== #
  # Lambda #2 — agrégation hebdomadaire
  # ======================================================================== #

  FonctionRapportHebdo:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-generer-rapport-hebdo"
      Description: Agrégation des 7 derniers jours, thèmes récurrents, envoi SES
      CodeUri: src/generer_rapport_hebdo/
      Handler: app.lambda_handler
      Timeout: 120
      Environment:
        Variables:
          TABLE_AVIS: !Ref TableAvis
          TABLE_RAPPORTS: !Ref TableRapports
          INDEX_AVIS_PAR_MOIS: avis-par-mois
          EXPEDITEUR_SES: !Ref EmailExpediteur
          DESTINATAIRES_SES: !Ref EmailManager
          FUSEAU_HORAIRE: !Ref FuseauPlanification
          URL_DASHBOARD: !GetAtt BucketSiteWeb.WebsiteURL
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TableAvis
        - DynamoDBCrudPolicy:
            TableName: !Ref TableRapports
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: "*"
              Condition:
                StringEquals:
                  ses:FromAddress: !Ref EmailExpediteur
      Events:
        PlanificationHebdomadaire:
          Type: ScheduleV2
          Properties:
            Name: !Sub "${AWS::StackName}-rapport-hebdo"
            Description: Génère le rapport de satisfaction de la semaine écoulée.
            ScheduleExpression: !Ref ExpressionPlanification
            ScheduleExpressionTimezone: !Ref FuseauPlanification
            # Déclenchement à l'heure pile : le rapport doit être dans la boîte
            # mail du manager avant sa prise de poste.
            FlexibleTimeWindow:
              Mode: "OFF"
            Input: '{"jours": 7, "envoyer_email": true}'
            RetryPolicy:
              MaximumRetryAttempts: 2

  # ======================================================================== #
  # Lambda #3 + API Gateway + Cognito
  # ======================================================================== #

  PoolUtilisateurs:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-managers"
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      # Le tableau de bord est réservé à l'encadrement : aucune auto-inscription,
      # les comptes sont créés par un administrateur.
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false

  ClientPoolUtilisateurs:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${AWS::StackName}-dashboard"
      UserPoolId: !Ref PoolUtilisateurs
      # Application front purement statique : aucun secret ne peut y être caché.
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 1
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  ApiRapports:
    Type: AWS::Serverless::HttpApi
    Properties:
      # HTTP API plutôt que REST API : environ 70 % moins cher, latence plus
      # faible, et surtout autoriseur JWT natif — aucune Lambda d'autorisation
      # à écrire pour valider les jetons Cognito.
      StageName: v1
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, OPTIONS]
        MaxAge: 300
      Auth:
        DefaultAuthorizer: AutorisateurCognito
        Authorizers:
          AutorisateurCognito:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              # L'audience correspond au client Cognito : le front doit donc
              # présenter l'ID token (l'access token porte `client_id`, pas `aud`).
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${PoolUtilisateurs}"
              audience:
                - !Ref ClientPoolUtilisateurs

  FonctionApiRapports:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-api-rapports"
      Description: Backend HTTP du tableau de bord manager
      CodeUri: src/api_rapports/
      Handler: app.lambda_handler
      Environment:
        Variables:
          TABLE_AVIS: !Ref TableAvis
          TABLE_RAPPORTS: !Ref TableRapports
          INDEX_RAPPORTS: rapports-par-date
          INDEX_AVIS_PAR_MOIS: avis-par-mois
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TableAvis
        - DynamoDBReadPolicy:
            TableName: !Ref TableRapports
      Events:
        ListerRapports:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiRapports
            Method: GET
            Path: /rapports
        DetailRapport:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiRapports
            Method: GET
            Path: /rapports/{semaine_id}
        ListerAvis:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiRapports
            Method: GET
            Path: /avis

  # ======================================================================== #
  # Messagerie
  # ======================================================================== #

  IdentiteExpediteur:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref EmailExpediteur

  IdentiteManager:
    Type: AWS::SES::EmailIdentity
    Condition: DestinataireDistinct
    Properties:
      EmailIdentity: !Ref EmailManager

  # ======================================================================== #
  # Observabilité
  # ======================================================================== #

  SujetAlertes:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-alertes"
      DisplayName: NordicHome alertes
      Subscription:
        - Protocol: email
          Endpoint: !Ref EmailManager

  JournalTraiterAvis:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-traiter-avis"
      RetentionInDays: !Ref RetentionLogsJours

  JournalRapportHebdo:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-generer-rapport-hebdo"
      RetentionInDays: !Ref RetentionLogsJours

  JournalApiRapports:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-api-rapports"
      RetentionInDays: !Ref RetentionLogsJours

  AlarmeErreursTraiterAvis:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-erreurs-traiter-avis"
      AlarmDescription: Au moins une erreur d'analyse d'avis sur 5 minutes.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref FonctionTraiterAvis}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      # Sans invocation, la métrique est absente : ne pas la traiter comme un incident.
      TreatMissingData: notBreaching
      AlarmActions: [!Ref SujetAlertes]

  AlarmeEchecRapport:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-echec-rapport-hebdo"
      AlarmDescription: >
        Le rapport hebdomadaire a échoué. Comme il ne s'exécute qu'une fois par
        semaine, chaque échec est bloquant pour le livrable métier.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref FonctionRapportHebdo}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref SujetAlertes]

  AlarmeLettresMortes:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-avis-non-traites"
      AlarmDescription: Des avis ont épuisé leurs réessais et sont en file de lettres mortes.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - {Name: QueueName, Value: !GetAtt FileLettresMortes.QueueName}
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref SujetAlertes]

# --------------------------------------------------------------------------- #
Outputs:
# --------------------------------------------------------------------------- #
  Region:
    Description: Région unique de déploiement
    Value: !Ref AWS::Region

  BucketAvis:
    Description: Bucket de dépôt des avis bruts (préfixe incoming/)
    Value: !Ref BucketAvis

  BucketSiteWeb:
    Description: Bucket hébergeant le tableau de bord
    Value: !Ref BucketSiteWeb

  UrlDashboard:
    Description: URL publique du tableau de bord
    Value: !GetAtt BucketSiteWeb.WebsiteURL

  UrlApi:
    Description: Racine de l'API REST du tableau de bord
    Value: !Sub "https://${ApiRapports}.execute-api.${AWS::Region}.amazonaws.com/v1"

  PoolUtilisateursId:
    Description: Identifiant du pool Cognito
    Value: !Ref PoolUtilisateurs

  ClientPoolUtilisateursId:
    Description: Identifiant du client applicatif Cognito
    Value: !Ref ClientPoolUtilisateurs

  TableAvis:
    Value: !Ref TableAvis

  TableRapports:
    Value: !Ref TableRapports

  FonctionRapportHebdo:
    Description: Nom de la Lambda d'agrégation (invocation manuelle pour la démo)
    Value: !Ref FonctionRapportHebdo
